[package]
name = "vein-adapter"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared storage adapters for Vein services"
keywords = ["storage", "cache", "adapter"]
categories = ["database"]

[lints]
workspace = true

[features]
default = ["tls"]
tls = ["sqlx/tls-rustls-aws-lc-rs"]
# `test_support::connect_test_backend` for dependants' test suites.
test-support = []

[dependencies]
anyhow.workspace = true
sqlx = { workspace = true, features = ["migrate", "postgres"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "sync"] }
jiff.workspace = true
jiff-sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
