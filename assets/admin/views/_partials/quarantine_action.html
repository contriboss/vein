{% component quarantine_action(gem, action, label, btn_class) %}
<form method="post" action="/quarantine/{{ action }}" style="display:inline">
  <input type="hidden" name="registry" value="{{ gem.registry }}">
  <input type="hidden" name="name" value="{{ gem.name }}">
  <input type="hidden" name="version" value="{{ gem.version }}">
  <input type="hidden" name="platform" value="{{ gem.platform_raw }}">
  <input type="text" name="reason" placeholder="Reason">
  <button type="submit" class="btn {{ btn_class }}">{{ label }}</button>
</form>
{% endcomponent quarantine_action %}
