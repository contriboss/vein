name: release-please

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and upload artifacts'
        type: boolean
        default: false
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        type: string

permissions:
  contents: write
  pull-requests: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || inputs.force_build }}
      tag_name: ${{ steps.release.outputs.tag_name || inputs.tag }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ !inputs.force_build }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || inputs.force_build }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: vein-linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            name: vein-linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            name: vein-darwin-amd64
          - runner: macos-latest
            target: aarch64-apple-darwin
            name: vein-darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: contains(matrix.target, 'linux')
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.name }}.tar.gz vein
          mv ${{ matrix.name }}.tar.gz ${{ github.workspace }}/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.tar.gz
          retention-days: 1

  build-freebsd:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || inputs.force_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          copyback: true
          prepare: |
            fetch -qo /tmp/upkg-install.sh https://raw.githubusercontent.com/seuros/upkg/master/install.sh
            sh /tmp/upkg-install.sh
            upkg install cmake llvm
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99
          run: |
            . "$HOME/.cargo/env"
            LIBCLANG_PATH="$(ls -d /usr/local/llvm*/lib | sort -V | tail -1)"
            export LIBCLANG_PATH
            cargo build --release
            mkdir -p dist
            cd target/release
            tar czf vein-freebsd-amd64.tar.gz vein
            mv vein-freebsd-amd64.tar.gz ../../dist/

      - uses: actions/upload-artifact@v7
        with:
          name: vein-freebsd-amd64
          path: dist/vein-freebsd-amd64.tar.gz
          retention-days: 1

  upload-assets:
    needs: [release-please, build, build-freebsd]
    if: ${{ always() && (needs.release-please.outputs.release_created || inputs.force_build) && (needs.build.result == 'success' || needs.build-freebsd.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: vein-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: artifacts/*

  # Reuses the `build` job's binaries instead of compiling a second time:
  # that used to happen inside the Dockerfile's builder stage, and under
  # linux/arm64 QEMU emulation it hung for 55 minutes and had to be
  # cancelled. Dockerfile.release only copies the binary in - no compiler,
  # so a native runner per arch is cheap even without reusing the binary,
  # but this also means the actual compile happens exactly once per arch.
  # Each leg pushes by digest only; merge-docker stitches the manifest list.
  build-docker:
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created || inputs.force_build }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: vein-linux-${{ matrix.suffix }}

      - name: Unpack the release binary into the build context
        run: tar xzf vein-linux-${{ matrix.suffix }}.tar.gz

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.release
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/contriboss/vein,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker:
    needs: [release-please, build-docker]
    if: ${{ needs.release-please.outputs.release_created || inputs.force_build }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/contriboss/vein
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
            type=sha

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/contriboss/vein@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
