name: Test

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every registry is a feature: the full build, then each one alone.
        # `name` keys the cache: cache keys cannot contain commas.
        include:
          - { name: default, features: default }
          - { name: gems, features: "tls,admin,gems" }
          - { name: crates, features: "tls,admin,crates" }
          - { name: npm, features: "tls,admin,npm" }
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: vein
          POSTGRES_PASSWORD: vein
          POSTGRES_DB: vein_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vein -d vein_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VEIN_TEST_DATABASE_URL: postgres://vein:vein@localhost:5432/vein_test
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version and its components (clippy).
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Run tests
        run: |
          if [ "${{ matrix.features }}" = default ]; then
            cargo test --workspace
          else
            cargo clippy -p vein --all-targets --no-default-features --features "${{ matrix.features }}" -- -D warnings
            cargo test -p vein --no-default-features --features "${{ matrix.features }}"
          fi
