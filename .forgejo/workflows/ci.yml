name: test
on: [push]

env:
  # FreeBSD's make mis-parses the MAKEFLAGS cargo/RubyGems pass along
  MAKE: gmake
  CARGO_TERM_COLOR: never
  # rama-dns generates bindings with bindgen, which needs libclang
  LIBCLANG_PATH: /usr/local/llvm19/lib
  # A Postgres the suite may create schemas in; configure it on the runner.
  VEIN_TEST_DATABASE_URL: ${{ secrets.VEIN_TEST_DATABASE_URL }}

jobs:
  test:
    runs-on: freebsd
    steps:
      - uses: actions/checkout@v7

      - name: toolchain
        run: |
          rustc --version
          sysctl -n security.jail.jailed

      - name: cargo test
        run: cargo test --workspace
