# Vein Configuration Example
# Copy to vein.toml and customize as needed

[server]
host = "0.0.0.0"
port = 8346
workers = 4  # Number of worker threads (default: CPU count)

[storage]
path = "./gems"  # Local filesystem storage for cached gems

[database]
# Postgres is the only backend. `docker compose up postgres` provides one.
url = "postgres://vein:vein@localhost:5432/vein"
max_connections = 10  # connection pool size

# DATABASE RELIABILITY CONFIGURATION
[database.reliability.retry]
enabled = true                    # Enable automatic retries (default: true)
max_attempts = 5                  # Maximum retry attempts including initial request (default: 5)
initial_backoff_ms = 500          # Initial backoff delay in milliseconds (default: 500)
max_backoff_secs = 30             # Maximum backoff delay in seconds (default: 30)
backoff_strategy = "exponential"  # Strategy: "exponential", "fibonacci", or "constant" (default: "exponential")
# backoff_strategy = "fibonacci"  # Fibonacci: 500ms, 500ms, 1000ms, 1500ms, 2500ms...
# backoff_strategy = "constant"   # Constant: always uses initial_backoff_ms

[logging]
level = "info"  # debug, info, warn, error
json = false     # Set to true for JSON-formatted logs

# ADMIN DASHBOARD (builds with the `admin` feature; on by default)
# Served on its own listener next to the proxy, with the cache exposed to
# agents at /mcp. Loopback binds need no auth; any other bind requires the
# VEIN_ADMIN_MCP_TOKEN environment variable or /mcp stays off.
[admin]
enabled = true
host = "127.0.0.1"
port = 9400

[admin.mcp]
enabled = true

# UPSTREAM CONFIGURATION (Optional)
# By default, Vein runs in cache-only mode.
# Uncomment this section to enable proxying to an upstream server:

# [upstream]
# url = "https://rubygems.org"                 # primary upstream
# fallback_urls = ["https://gems.coop"]        # optional fallback list, tried in order
# timeout_secs = 30
# connection_pool_size = 128
#
# [upstream.reliability.retry]
# enabled = true
# max_attempts = 3
# initial_backoff_ms = 100
# max_backoff_secs = 2
# backoff_strategy = "exponential"

# NAME CATALOGS
# Search (vein://search/..., `cargo search --registry vein`, `npm search`)
# asks the registry first; out of reach, it answers from these lists of
# every published name. gem: under 3 MB. crate: ~360k names, an hour of
# paging the first time. npm: ~4.5M names, ~450 MB the first time. Each is
# refreshed every 6 hours.
# Only registries this vein was built with (the `gems`, `crates` and `npm`
# Cargo features); naming another is a config error.
# [catalog]
# registries = ["gem", "crate", "npm"]   # default: ["gem"] when gems are built in

# RELEASE DELAY (Optional, off by default)
# New gem, crate and npm versions stay out of the index Vein serves until
# their delay is over, counted from when the registry published them. A
# malicious release yanked within hours never reaches a client. Held
# versions stay downloadable (a lockfile may name one); blocked ones do not.
# Review and decide at /quarantine on the admin dashboard, or with
# `vein quarantine list|approve|block`.

# [delay_policy]
# enabled = true
# default_delay_days = 3
# skip_weekends = true          # a release due on a weekend waits for Monday
# business_hours_only = true    # released at release_hour_utc
# release_hour_utc = 9          # 0-23
#
# # Per-package delays, first match wins. `registry` is gem, crate or npm;
# # without it the entry covers that name in every registry.
# [[delay_policy.packages]]
# name = "rails"
# delay_days = 7
#
# [[delay_policy.packages]]
# registry = "npm"
# name = "@my-org/*"
# pattern = true
# delay_days = 0                # your own packages: no delay
#
# # Several exact names in one entry: safer than a glob, which would also
# # cover anyone else's package that happens to match.
# [[delay_policy.packages]]
# registry = "crate"
# names = ["my-crate", "my-crate-macros"]
# delay_days = 0
#
# # Release one version early (e.g. a security fix).
# [[delay_policy.pinned]]
# registry = "gem"
# name = "nokogiri"
# version = "1.18.10"
# reason = "security fix"

# CODE CONTEXT (Optional, off by default)
# MCP tools from a provider indexing public open-source code and docs:
# search, read, list and grep inside a package or repository, examples and
# research from other projects. Queries leave this network. GitHits needs an
# API token (ghi-...) from its account settings: VEIN_GITHITS_TOKEN, or a
# file only vein can read. Built with the `githits` Cargo feature (default).
# [code_context]
# provider = "githits"
# tools = ["search", "search_status", "list", "read", "grep"]   # default: all
# [code_context.githits]
# token_file = "/usr/local/etc/vein/githits.token"
