[workspace]
members = ["crates/vein-adapter"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/contriboss/vein"
homepage = "https://github.com/contriboss/vein"

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jiff = { version = "0.2.38", features = ["serde"] }
jiff-sqlx = { version = "0.2.0", features = ["postgres"] }
percent-encoding = "2.3"
# Rama network framework; members add `std`, `tcp`, `rustls`, `opentelemetry`.
rama = { version = "0.4.0", default-features = false, features = ["http-full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = { package = "serde_yaml_ng", version = "0.10.0" }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio"] }
tempfile = "3.27.0"
tokio = "1.53.2"
toml = "1.1.8"
tracing = "0.1.44"
vein-adapter = { version = "0.5.0", path = "crates/vein-adapter", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
rust_2024_compatibility = { level = "warn", priority = -1 }
# Library test harnesses are binaries too; the lib roots allow this under cfg(test).
dead_code_pub_in_binary = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
mod_module_files = "warn"
# The binaries are the product; `vein` is an internal library, not a published API.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Request handlers are long by nature; splitting them is tracked separately.
too_many_lines = "allow"
# u64 -> f64 for human-readable sizes and ratios.
cast_precision_loss = "allow"
# Opinionated / noisy nursery lints.
option_if_let_else = "allow"
similar_names = "allow"
# rama clients and services carry significant-drop markers, so every ordinary
# `let client = ...` binding trips this.
significant_drop_tightening = "allow"

[package]
name = "vein"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A fast, intelligent multi-ecosystem package proxy/cache"
readme = "README.md"
keywords = ["rubygems", "crates", "npm", "proxy", "cache"]
categories = ["development-tools", "caching", "network-programming"]
exclude = ["tests/", "assets/"]

[lints]
workspace = true

[lib]
name = "vein"
path = "src/lib.rs"

[[bin]]
name = "vein"
path = "src/main.rs"

[features]
default = ["tls", "admin", "gems", "crates", "npm", "githits"]
tls = ["rama/rustls", "vein-adapter/tls"]
# The registries vein serves, at least one: each brings its proxy routes,
# search, docs, catalog, release delay and MCP resources.
gems = ["dep:ruby-prism", "dep:cyclonedx-bom", "dep:serde_yaml"]
crates = ["dep:ruzstd"]
npm = []
# Code context providers for the MCP's tools; inert until `[code_context]`
# names one. GitHits: https://githits.com, over its hosted MCP.
githits = ["admin", "tls", "dep:mcp-guest"]
# Admin dashboard and MCP endpoint, served next to the proxy (`[admin]` in vein.toml).
admin = ["dep:tera", "dep:mcp-host"]
inspect = []

[dependencies]
rama = { workspace = true, features = ["std", "tcp", "opentelemetry"] }

# OTLP span exporter (rama no longer re-exports the HTTP exporter; only the
# grpc `collector` is bundled). Uses the hyper client already in the tree.
# Must track the opentelemetry minor rama builds against (0.32 as of rama 0.4):
# a newer exporter implements a different SDK's `SpanExporter` trait.
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "http-proto", "hyper-client"] }

# Async runtime
tokio = { workspace = true, features = ["full"] }

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
toml.workspace = true

# File handling and hashing
sha2.workspace = true

# Archive handling
hex.workspace = true
flate2 = "1.1.10"
tar = "0.4.46"
cyclonedx-bom = { version = "0.8.1", optional = true }

# Error handling
anyhow.workspace = true

# CLI
clap.workspace = true

# Utilities
percent-encoding.workspace = true


# State machines
state-machines = "0.32.1"
breaker-machines = { version = "0.20.0", features = ["async"] }
chrono-machines = { version = "0.9.0", features = ["async"] }

# Time handling
jiff.workspace = true

# Logging (rama re-exports the same crate; the admin modules use it directly)
tracing.workspace = true

# Admin dashboard (feature `admin`)
tera = { version = "2.4.0", optional = true }
mcp-host = { version = "0.14.0", default-features = false, features = ["http", "macros"], optional = true }
# MCP client for code context providers. No `tls-*` feature: vein's rama
# rustls and the aws-lc-rs provider it installs serve it, as they serve every
# other client here (rama's `aws-lc` would add bindgen, and CMake builds).
mcp-guest = { version = "0.12.0", default-features = false, features = ["http"], optional = true }

vein-adapter.workspace = true
# Background jobs (catalog syncs, delay promotions) in vein's own Postgres.
# Without default features it brings no TLS: sqlx keeps vein-adapter's.
stampeded = { version = "0.4.0", default-features = false }
sqlx = { workspace = true, features = ["postgres"] }
# docs.rs serves rustdoc JSON zstd-compressed.
ruzstd = { version = "0.9.1", optional = true }
# Gem API docs: the gem's Ruby, parsed without a Ruby on the host.
ruby-prism = { version = "2.0.0", optional = true }

[dev-dependencies]
tempfile.workspace = true
sqlx.workspace = true
vein-adapter = { workspace = true, features = ["test-support"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"   # Smaller binary, faster panics, backtraces via unwind tables (Rust 1.95.0+)
strip = true      # Strip symbols for smaller binary
